version: '3.6'

services:
  crossref-search:
    build: .
    environment:
      STAGE: test
    env_file:
      - ./config/.env
    expose:
      - "5000"
    volumes:
      - ./:/code
    restart: always
    extra_hosts:
      - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:latest
    ports:
      - "5050:80"
      - "5051:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./start-nginx.sh:/start-nginx.sh
    command: ["/start-nginx.sh"]
    depends_on:
      - crossref-search

